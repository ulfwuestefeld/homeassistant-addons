name: One.com DynDNS Security and Lint CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: onecomdyndns/requirements.txt

      - name: Install dependencies
        working-directory: onecomdyndns
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pip-audit safety

      - name: Ruff (lint)
        working-directory: onecomdyndns
        run: ruff check .

      - name: Bandit (security scan)
        working-directory: onecomdyndns
        run: bandit -r . -f json -o bandit_report.json || true

      - name: Pip Audit (vulnerability scan)
        working-directory: onecomdyndns
        run: pip-audit -r requirements.txt -f json -o pip_audit.json || true

      - name: Safety (vulnerability DB scan)
        working-directory: onecomdyndns
        run: |
          safety check -r requirements.txt --full-report --output json -o safety_report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v7
        with:
          name: onecom-security-reports
          path: |
            onecomdyndns/bandit_report.json
            onecomdyndns/pip_audit.json
            onecomdyndns/safety_report.json
