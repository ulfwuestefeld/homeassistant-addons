name: Gas & Water Meter CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.14"
                  cache: "pip"
                  cache-dependency-path: gasandwater/requirements_test.txt

            - name: Install test requirements
              working-directory: gasandwater
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements_test.txt

            - name: Ruff format check
              working-directory: gasandwater
              run: python -m ruff format --check gas-water-meter/custom_components/ tests/

            - name: Run Ruff
              working-directory: gasandwater
              run: python -m ruff check gas-water-meter/custom_components/ tests/

            - name: Run Bandit security scan
              working-directory: gasandwater
              run: |
                  python -m pip install bandit
                  python -m bandit -r gas-water-meter/custom_components/ -n 5

            - name: Run tests
              working-directory: gasandwater
              run: python -m pytest tests/ -q
