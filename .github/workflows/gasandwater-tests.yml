name: Gas & Water Meter Tests

on:
  push:
    branches: ["main", "master", "dev"]
  pull_request:
    branches: ["main", "master", "dev"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: gasandwater/requirements_test.txt

      - name: Install test requirements
        working-directory: gasandwater
        run: python -m pip install -r requirements_test.txt

      - name: Run Ruff check
        working-directory: gasandwater
        run: python -m ruff check gas-water-meter/custom_components/ tests/

      - name: Run Ruff format check
        working-directory: gasandwater
        run: python -m ruff format --check gas-water-meter/custom_components/ tests/

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: gasandwater/frontend-src/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: gasandwater/frontend-src

      - name: Run frontend tests
        run: npm test
        working-directory: gasandwater/frontend-src

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: gasandwater/requirements_test.txt

      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        working-directory: gasandwater
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Create custom_components symlink
        working-directory: gasandwater
        run: ln -s gas-water-meter/custom_components custom_components

      - name: Run tests
        working-directory: gasandwater
        run: |
          pytest tests/ \
            --timeout=30 \
            -v \
            --cov=gas-water-meter/custom_components/gas_water_meter \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: gasandwater-coverage-report
          path: gasandwater/coverage.xml
